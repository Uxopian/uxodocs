app:
  gateway:
    provider-header: X-Provider-ID
  routes:
    - id: uxopian-ai
      uri: http://uxopian-ai:8080
      prefix: /uxopian-ai/
      path: /uxopian-ai/**
      rewritePath: /uxopian-ai/?(?<segment>.*), /uxopian-ai/$\{segment}
      provider: DevProvider
      security:
        - path: /.well-known/**
          public: true
        - path: /assets/**
          public: true
        - path: /v3/**
          public: true
        - path: /swagger-ui/**
          public: true
        - path: /actuator/health
          public: true
        - path: /admin/**
          #roles: [ "ADMIN" ]
          public: true
        - path: /api/v1/admin/**
          #roles: [ "ADMIN" ]
          public: true
        - path: /swagger-ui/index.html
          public: true

    - id: uxopian-ai-ws
      uri: ws://uxopian-ai:8080
      path: /uxopian-ai/ws/**
      prefix: /uxopian-ai/ws/
      security:
        - path: /**
          public: true

server:
  port: 8085
