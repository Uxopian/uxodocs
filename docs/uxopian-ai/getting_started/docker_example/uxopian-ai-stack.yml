version: "3.7"

services:
  # ── OpenSearch ──────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.6.0}
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - uxopian-ai-net
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Uxopian AI ──────────────────────────────────────────────────────────────
  # Not exposed to the host. All browser traffic goes through the gateway.
  uxopian-ai:
    image: ${REGISTRY:-artifactory.arondor.cloud:5001}/uxopian-ai:${UXOPIAN_VERSION:-2026.0.0-ft5}
    # image: docker.uxopian.com/preview/uxopian-ai:${UXOPIAN_VERSION:-2026.0.0-ft5}
    environment:
      - JAVA_OPTS=-Xmx768m -Xms512m
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_FORCE_REFRESH_INDEX=false
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8085}
      - UXOPIAN_AI_PORT=8080
      # LLM API keys — loaded from .env, set at least one before starting
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    expose:
      - "8080"
    volumes:
      - ./config:/app/config
    networks:
      - uxopian-ai-net
    depends_on:
      opensearch:
        condition: service_healthy

  # ── Gateway ─────────────────────────────────────────────────────────────────
  # The gateway is the only service exposed to the host (port 8085).
  # DevProvider always injects a fixed dev identity (dev/dev/ADMIN) — suitable for local development.
  # Replace with FlowerDocsProvider or Fast2Provider for production.
  uxopian-gateway:
    image: ${REGISTRY:-artifactory.arondor.cloud:5001}/uxopian-gateway:${UXOPIAN_VERSION:-2026.0.0-ft5}
    # image: docker.uxopian.com/preview/uxopian-gateway:${UXOPIAN_VERSION:-2026.0.0-ft5}
    ports:
      - "8085:8085"
    volumes:
      - ./gateway-application.yaml:/app/application.yaml
    networks:
      - uxopian-ai-net
    depends_on:
      - uxopian-ai
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  opensearch-data:

networks:
  uxopian-ai-net:
