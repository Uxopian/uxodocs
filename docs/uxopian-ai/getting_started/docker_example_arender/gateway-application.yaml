app:
  gateway:
    provider-header: X-Provider-ID
  routes:
    - id: uxopian-ai
      uri: http://uxopian-ai-standalone-service:8080
      prefix: /uxopian-ai/
      path: /uxopian-ai/**
      rewritePath: /uxopian-ai/?(?<segment>.*), /uxopian-ai/$\{segment}
      provider: DevProvider
      security:
        - path: /**
          public: true

    - id: uxopian-ai-ws
      uri: ws://uxopian-ai-standalone-service:8080
      path: /uxopian-ai/ws/**
      prefix: /uxopian-ai/ws/
      security:
        - path: /**
          public: true

server:
  port: 8085

logging:
  level:
    com.uxopian: DEBUG
