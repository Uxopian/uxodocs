services:

  # ── Traefik Reverse Proxy ────────────────────────────────────────────────────
  proxy:
    image: traefik:3.6
    mem_limit: 128m
    container_name: alfresco-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=20m"
      - "--entryPoints.traefik.address=:8888"
      - "--accesslog=true"
      - "--providers.docker.exposedByDefault=false"
      - "--ping.entrypoint=web"
      - "--ping=true"
    ports:
      - "8080:8080"
      - "8888:8888"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alfresco-arender-net

  # ── Alfresco Content Repository ──────────────────────────────────────────────
  # Built locally — adds custom Uxopian AI webscripts on top of Alfresco Community.
  # Requires: alfresco-arender-files/ extracted next to this file (see quickstart).
  alfresco:
    build:
      context: .
      dockerfile: Dockerfile.alfresco-repository
      additional_contexts:
        module: ../../../uxopian-ai/alfresco-arender-files
    container_name: alfresco
    mem_limit: 1900m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alfresco.rule=PathPrefix(`/`)"
      - "traefik.http.services.alfresco.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=5368709120"
      - "traefik.http.middlewares.alfresco-root-redirect.redirectregex.regex=^https?://[^/]+/([^/.]+)$$"
      - "traefik.http.middlewares.alfresco-root-redirect.redirectregex.replacement=$$0/"
      - "traefik.http.middlewares.alfresco-chain.chain.middlewares=alfresco-root-redirect@docker,limit@docker"
      - "traefik.http.routers.alfresco.middlewares=alfresco-chain@docker"
    networks:
      - alfresco-arender-net
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy

  # ── Alfresco Share ───────────────────────────────────────────────────────────
  # Built locally — adds ARender plugin + Uxopian AI web components and actions.
  # Requires: alfresco-arender-files/ extracted next to this file (see quickstart).
  # UXOPIAN_AI_HOST is baked into the image at build time; override via UXOPIAN_AI_PUBLIC_URL in .env.
  share:
    build:
      context: .
      dockerfile: Dockerfile.alfresco-share
      additional_contexts:
        module: ../../../uxopian-ai/alfresco-arender-files
        webcomponents: ../../../uxopian-ai/alfresco-arender-files/web-components-output
      args:
        UXOPIAN_AI_HOST: "${UXOPIAN_AI_PUBLIC_URL:-http://localhost:8085/share/uxopian-ai}"
    image: alfresco-share-arender:25.3.0
    container_name: alfresco-share
    mem_limit: 1g
    environment:
      CSRF_FILTER_ORIGIN: "http://localhost:8080"
      CSRF_FILTER_REFERER: "http://localhost:8080/share/.*"
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.share.rule=PathPrefix(`/share`)"
      - "traefik.http.services.share.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.share-root-redirect.redirectregex.regex=/share$$"
      - "traefik.http.middlewares.share-root-redirect.redirectregex.replacement=/share/"
      - "traefik.http.middlewares.share-chain.chain.middlewares=share-root-redirect@docker,limit@docker"
      - "traefik.http.routers.share.middlewares=share-chain@docker"
    networks:
      - alfresco-arender-net
    depends_on:
      alfresco:
        condition: service_healthy
      arender-ui:
        condition: service_started

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.5
    mem_limit: 512m
    container_name: alfresco-postgres
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - alfresco-arender-net

  # ── Solr ─────────────────────────────────────────────────────────────────────
  solr6:
    image: docker.io/alfresco/alfresco-search-services:2.0.17
    mem_limit: 2g
    container_name: alfresco-solr6
    environment:
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    ports:
      - "8083:8983"
    volumes:
      - solr-data:/opt/alfresco-search-services/data
    networks:
      - alfresco-arender-net

  # ── Transform Service ────────────────────────────────────────────────────────
  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.3.0
    mem_limit: 1536m
    container_name: alfresco-transform
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    networks:
      - alfresco-arender-net
    depends_on:
      activemq:
        condition: service_healthy

  # ── ActiveMQ ─────────────────────────────────────────────────────────────────
  activemq:
    image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8
    mem_limit: 1g
    container_name: alfresco-activemq
    ports:
      - "8161:8161"
      - "5672:5672"
      - "61616:61616"
      - "61613:61613"
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - alfresco-arender-net

  # ── ARender UI ───────────────────────────────────────────────────────────────
  arender-ui:
    image: ${REGISTRY:-artifactory.arondor.cloud:5001}/arender-ui-springboot:2023.16.0-alfresco
    container_name: arender-ui
    mem_limit: 2g
    environment:
      ARENDERSRV_ARENDER_SERVER_ALFRESCO_ATOM_PUB_URL: "http://alfresco:8080/alfresco/api/-default-/cmis/versions/1.1/atom"
      ARENDERSRV_ARENDER_SERVER_ALFRESCO_USER: "${ALFRESCO_ADMIN_USER:-admin}"
      ARENDERSRV_ARENDER_SERVER_ALFRESCO_PASSWORD: "${ALFRESCO_ADMIN_PASSWORD:-admin}"
      ARENDERSRV_ARENDER_SERVER_RENDITION_HOSTS: "http://service-broker:8761/"
      UXOPIAN_AI_HOST: "${UXOPIAN_AI_PUBLIC_URL:-http://localhost:8085/share/uxopian-ai}"
    ports:
      - "1789:8080"
    volumes:
      - ./arender-custom-server.properties:/home/arender/configurations/arender-custom-server.properties
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arender-ui.rule=PathPrefix(`/arendergwt`) || PathPrefix(`/arender`)"
      - "traefik.http.services.arender-ui.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.arender-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.arender-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.arender-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.arender-cors.headers.accesscontrolmaxage=3600"
      - "traefik.http.middlewares.arender-cors.headers.addvaryheader=true"
      - "traefik.http.routers.arender-ui.middlewares=arender-cors@docker"
    networks:
      - alfresco-arender-net
    depends_on:
      alfresco:
        condition: service_healthy
      service-broker:
        condition: service_started

  # ── ARender Document Service Broker ─────────────────────────────────────────
  service-broker:
    image: artifactory.arondor.cloud:5001/arender-document-service-broker:2023.16.0
    container_name: service-broker
    environment:
      - "DSB_KUBEPROVIDER_KUBE.HOSTS_DOCUMENT-CONVERTER=19999"
      - "DSB_KUBEPROVIDER_KUBE.HOSTS_DOCUMENT-RENDERER=9091"
      - "DSB_KUBEPROVIDER_KUBE.HOSTS_DOCUMENT-TEXT-HANDLER=8899"
      - "DSB_MICROSERVICES_PDFRENDERER=PDFOwl"
    ports:
      - "8761:8761"
    volumes:
      - arender-tmp:/arender/tmp
    networks:
      - alfresco-arender-net

  # ── ARender Document Renderer ────────────────────────────────────────────────
  document-renderer:
    image: artifactory.arondor.cloud:5001/arender-document-renderer-pdfowl:2023.16.0
    container_name: document-renderer
    hostname: drn-service
    environment:
      - "DRN_EUREKA_INSTANCE_METADATA.MAP_HOST.NAME=document-renderer"
      - "DRN_EUREKA_INSTANCE_HOSTNAME=service-broker"
      - "DRN_EUREKA_SERVER_PORT=8761"
      - "DRN_PDFOWL_CLIENT_WATCHDOG=60000"
    ports:
      - "9091:9091"
    volumes:
      - arender-tmp:/arender/tmp
    networks:
      - alfresco-arender-net
    depends_on:
      - service-broker

  # ── ARender Document Text Handler ───────────────────────────────────────────
  document-text-handler:
    image: artifactory.arondor.cloud:5001/arender-document-text-handler:2023.16.0
    container_name: document-text-handler
    environment:
      - "DTH_EUREKA_INSTANCE_METADATA.MAP_HOST.NAME=document-text-handler"
      - "DTH_EUREKA_INSTANCE_HOSTNAME=service-broker"
      - "DTH_EUREKA_SERVER_PORT=8761"
    ports:
      - "8899:8899"
    volumes:
      - arender-tmp:/arender/tmp
    networks:
      - alfresco-arender-net
    depends_on:
      - service-broker

  # ── ARender Document Converter ──────────────────────────────────────────────
  document-converter:
    image: artifactory.arondor.cloud:5001/arender-document-converter:2023.16.0
    container_name: document-converter
    environment:
      - "DCV_EUREKA_INSTANCE_METADATA.MAP_HOST.NAME=document-converter"
      - "DCV_APP_EUREKA_HOSTNAME=service-broker"
      - "DCV_APP_EUREKA_PORT=8761"
    ports:
      - "19999:19999"
    volumes:
      - arender-tmp:/arender/tmp
    networks:
      - alfresco-arender-net
    depends_on:
      - service-broker

  # ── OpenSearch ───────────────────────────────────────────────────────────────
  uxopian-ai-opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.3.2}
    container_name: uxopian-ai-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=uxopian-ai-opensearch
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./custom-opensearch.yml:/usr/share/opensearch/config/opensearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - alfresco-arender-net

  # ── Uxopian AI ───────────────────────────────────────────────────────────────
  # Pre-built image pulled from the registry — no local build needed.
  # Not exposed directly — accessed through the gateway at /share/uxopian-ai/
  uxopian-ai:
    image: ${REGISTRY:-artifactory.arondor.cloud:5001}/uxopian-ai:${UXOPIAN_VERSION:-2026.0.0-ft4}
    container_name: uxopian-ai
    environment:
      - JAVA_OPTS=-Xmx768m -Xms512m
      - OPENSEARCH_HOST=uxopian-ai-opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_FORCE_REFRESH_INDEX=false
      - RENDITION_BASE_URL=http://service-broker:8761
      - APP_BASE_URL=${UXOPIAN_AI_PUBLIC_URL:-http://localhost:8085/share/uxopian-ai}
      - UXOPIAN_AI_PORT=8080
      - ALFRESCO_BASE_URL=${ALFRESCO_BASE_URL:-http://share:8080/share/proxy/alfresco-api}
      - ALFRESCO_DEFAULT_TENANT_ID=${ALFRESCO_DEFAULT_TENANT_ID:-Tenant-development}
      # Default excludes alfresco (flowerdocs,files,interaction) — without this, the LLM never
      # gets Alfresco tools, even though the plugin JAR is present.
      - PLUGINS_TOOLS_ENABLED_TAGS=alfresco,files,interaction
      - SPRING_PROFILES_ACTIVE=dev
      # The gateway already applies CORS for browser-facing traffic (see gateway-application.yaml).
      # Disable uxopian-ai's own dev-profile CORS handling to avoid duplicate Access-Control-* headers,
      # which browsers reject outright.
      - APP_CORS_ENABLED=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
    depends_on:
      gateway-service:
        condition: service_started
      uxopian-ai-opensearch:
        condition: service_healthy
    volumes:
      - ./config:/app/config
    networks:
      - alfresco-arender-net

  # ── Gateway ──────────────────────────────────────────────────────────────────
  # Pre-built image pulled from the registry — no local build needed.
  # Exposes uxopian-ai at /share/uxopian-ai/ — validates Alfresco Share sessions.
  # Pinned separately from UXOPIAN_VERSION: uxopian-gateway has not shipped a
  # 2026.0.0-ft4 tag yet, so it stays on the latest available release.
  # Routed through Traefik on the SAME origin as Share (8080), not exposed on its
  # own port to the browser. uxopian-ai and the gateway both echo the request's
  # Origin back in Access-Control-Allow-Origin, and the two layers stack into a
  # duplicate header that Chrome/Firefox reject outright on a cross-origin call.
  # Same-origin requests never trigger the browser's CORS check, so serving
  # everything from :8080 sidesteps the bug instead of relying on a CORS fix in
  # either service.
  # The Traefik rule below deliberately excludes /share/uxopian-ai/components/**
  # and /share/uxopian-ai/uxopian-ai-chat.js: those are static JS/CSS baked into
  # the Share image itself (see Dockerfile.alfresco-share) and served by Share's
  # own Tomcat under the same path prefix — routing them to the gateway 404s and
  # silently breaks the chat widget (no console error, the menu item just never
  # appears). Everything else under /share/uxopian-ai/ (api, ws, admin, swagger)
  # is proxied to the gateway.
  gateway-service:
    image: ${REGISTRY:-artifactory.arondor.cloud:5001}/uxopian-gateway:${GATEWAY_VERSION:-2026.0.0-ft3}
    container_name: gateway-service
    environment:
      - JAVA_OPTS=-Xmx768m -Xms512m
    networks:
      - alfresco-arender-net
    ports:
      - "8085:8085"
    volumes:
      - ./gateway-application.yaml:/app/application.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/share/uxopian-ai`) && !PathPrefix(`/share/uxopian-ai/components`) && !Path(`/share/uxopian-ai/uxopian-ai-chat.js`)"
      - "traefik.http.routers.gateway.priority=100"
      - "traefik.http.services.gateway.loadbalancer.server.port=8085"

volumes:
  alfresco-data:
  postgres-data:
  solr-data:
  arender-tmp:
  opensearch-data:

networks:
  alfresco-arender-net:
    driver: bridge
