name: Version from branches → Build → Deploy

on:
  push:
    branches: [ test, 'test-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pages
  cancel-in-progress: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTS: "fast2 arender flowerdocs"

    steps:
      # ------------------------------------------------------------
      # Checkout avec LFS activé
      # ------------------------------------------------------------
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ------------------------------------------------------------
      # S'assurer que les fichiers LFS sont bien présents localement
      # ------------------------------------------------------------
      - name: Resolve LFS pointers (pre)
        run: |
          set -euo pipefail
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout
          if grep -RIl "git-lfs.github.com/spec/v1" static docs 2>/dev/null; then
            echo "::warning::LFS pointers still present before versioning"
          fi

      # ------------------------------------------------------------
      # Récupérer toutes les branches
      # ------------------------------------------------------------
      - name: Fetch all branches
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      # ------------------------------------------------------------
      # Installer Node.js et dépendances
      # ------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Nettoyer les anciennes versions et manifests
      # ------------------------------------------------------------
      - name: Clean old versions + manifests
        run: |
          rm -rf versioned_docs versioned_sidebars
          rm -f versions-*.json

      # ------------------------------------------------------------
      # Génération des versions à partir des branches test-<product>-v*
      # ------------------------------------------------------------
      - name: Generate Docusaurus versions (LFS-safe)
        shell: bash
        run: |
          set -euo pipefail

          for product in $PRODUCTS; do
            echo "=== ${product} ==="

            # Sauvegarde du "current"
            mkdir -p ".cache_${product}"
            rsync -a "docs/${product}/" ".cache_${product}/docs_current/"
            if [ -f "sidebars_${product}.ts" ]; then
              cp "sidebars_${product}.ts" ".cache_${product}/sidebars_current.ts"
            fi

            # Lister les branches versionnées
            mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | grep "^origin/test-${product}-v" | sed 's#^origin/##' | sort -V)

            for br in "${branches[@]}"; do
              ver="${br##test-${product}-}"
              echo "-> snapshot ${product} ${ver} from ${br}"

              wt=".wt_${product}_${ver}"
              git worktree add --force --detach "$wt" "origin/${br}"

              (
                set -euo pipefail
                cd "$wt"
                git lfs pull --include="docs/${product}/**" --exclude=""
                git lfs checkout
              )

              rm -rf .tmp_docs && mkdir -p .tmp_docs
              if [ -d "${wt}/docs/${product}" ]; then
                rsync -a --delete "${wt}/docs/${product}/" .tmp_docs/
              else
                echo "   (skip ${br}: docs/${product} not found)"
                git worktree remove -f "$wt"
                continue
              fi

              rsync -a --delete .tmp_docs/ "docs/${product}/"

              # Injecter la sidebar correspondante si elle existe
              if [ -f "${wt}/sidebars_${product}.ts" ]; then
                cp "${wt}/sidebars_${product}.ts" "sidebars_${product}.ts"
              fi

              # Créer le snapshot de version
              npx docusaurus "docs:version:${product}" "${ver}"

              # Supprimer le worktree
              git worktree remove -f "$wt"

              # Restaurer la sidebar courante
              if [ -f ".cache_${product}/sidebars_current.ts" ]; then
                cp ".cache_${product}/sidebars_current.ts" "sidebars_${product}.ts"
              fi
            done

            # Restaurer les docs courants
            rsync -a --delete ".cache_${product}/docs_current/" "docs/${product}/"
          done

      # ------------------------------------------------------------
      # Vérifier que les fichiers LFS sont bien résolus après versioning
      # ------------------------------------------------------------
      - name: Resolve LFS pointers (post)
        run: |
          set -euo pipefail
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout

      # ------------------------------------------------------------
      # Vérifier la cohérence des versions
      # ------------------------------------------------------------
      - name: Sanity check versions
        run: |
          set -euo pipefail
          for product in $PRODUCTS; do
            file="versions-${product}.json"
            if [ -f "$file" ]; then
              node -e "
                const fs=require('fs');
                const arr=JSON.parse(fs.readFileSync('$file','utf8'));
                for (const ver of arr) {
                  const dir=\`versioned_docs/version-${product}-\${ver}\`;
                  if (!fs.existsSync(dir)) {
                    console.error(\`Version \${ver} for ${product} is declared but missing.\`);
                    process.exit(1);
                  }
                  const hasDoc=(function walk(d){
                    return fs.readdirSync(d,{withFileTypes:true})
                      .some(e=>e.isFile()&&e.name.match(/\\.mdx?$/)||(e.isDirectory()&&walk(d+'/'+e.name)));
                  })(dir);
                  if(!hasDoc){
                    console.error(\`Version \${ver} for ${product} has no markdown files.\`);
                    process.exit(1);
                  }
                }
              "
            fi
          done

      # ------------------------------------------------------------
      # Build du site Docusaurus
      # ------------------------------------------------------------
      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      # ------------------------------------------------------------
      # Empêche GitHub Pages d’interpréter les fichiers du build
      # ------------------------------------------------------------
      - name: Add .nojekyll
        run: touch build/.nojekyll

      # ------------------------------------------------------------
      # Vérifier qu’aucun pointeur LFS n’est présent dans le build
      # ------------------------------------------------------------
      - name: Assert no LFS pointers in build
        run: |
          if grep -RIl "git-lfs.github.com/spec/v1" build 2>/dev/null; then
            echo "ERROR: LFS pointer found in build output."
            exit 1
          fi
          echo "✅ OK: no LFS pointers"

      # ------------------------------------------------------------
      # Déploiement vers GitHub Pages
      # ------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          force_orphan: true
