name: Version from branches → Build → Deploy

on:
  push:
    branches: [ test, 'test-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pages
  cancel-in-progress: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTS: "fast2 arender flowerdocs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Fetch all branches
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean old versions
        run: |
          rm -rf versioned_docs versioned_sidebars
          rm -f versions-*.json

      - name: Generate Docusaurus versions
        shell: bash
        run: |
          set -euo pipefail

          for product in $PRODUCTS; do
            echo "=== Processing ${product} ==="

            # Sauvegarder current
            cp -r "docs/${product}" ".tmp_${product}_current"
            [ -f "sidebars_${product}.ts" ] && cp "sidebars_${product}.ts" ".tmp_${product}_sidebar"

            # Récupérer les branches versionnées
            branches=$(git branch -r | grep "origin/test-${product}-v" | sed 's|origin/||' | sort -V)

            for branch in $branches; do
              version="${branch##test-${product}-}"
              echo "→ Creating version ${version} from ${branch}"

              # Checkout de la branche
              git checkout "origin/${branch}" -- "docs/${product}" "sidebars_${product}.ts" 2>/dev/null || true

              # Vérifier qu'il y a des fichiers markdown
              if ! find "docs/${product}" -type f \( -name "*.md" -o -name "*.mdx" \) -quit | grep -q .; then
                echo "   ⚠️  Skip ${version}: no markdown files"
                continue
              fi

              # Créer la version
              npx docusaurus "docs:version:${product}" "${version}"

              echo "   ✅ Version ${version} created"
            done

            # Restaurer current
            rm -rf "docs/${product}"
            mv ".tmp_${product}_current" "docs/${product}"
            [ -f ".tmp_${product}_sidebar" ] && mv ".tmp_${product}_sidebar" "sidebars_${product}.ts"
          done

      - name: Validate versions
        shell: bash
        run: |
          set -euo pipefail
          
          for product in $PRODUCTS; do
            versions_file="versions-${product}.json"
            [ ! -f "$versions_file" ] && continue

            echo "Validating ${product} versions..."
            
            # Nettoyer les versions vides
            node -e "
              const fs = require('fs');
              const path = require('path');
              
              const file = '${versions_file}';
              const product = '${product}';
              let versions = JSON.parse(fs.readFileSync(file, 'utf8'));
              
              const valid = versions.filter(ver => {
                const dir = \`versioned_docs/version-\${product}-\${ver}\`;
                if (!fs.existsSync(dir)) {
                  console.log(\`  ❌ Missing: \${ver}\`);
                  return false;
                }
                
                const hasMarkdown = (d) => {
                  return fs.readdirSync(d, { withFileTypes: true }).some(e => 
                    (e.isFile() && /\\.mdx?$/.test(e.name)) || 
                    (e.isDirectory() && hasMarkdown(path.join(d, e.name)))
                  );
                };
                
                if (!hasMarkdown(dir)) {
                  console.log(\`  ❌ Empty: \${ver}\`);
                  return false;
                }
                
                console.log(\`  ✅ Valid: \${ver}\`);
                return true;
              });
              
              if (valid.length !== versions.length) {
                console.log(\`Cleaned: \${versions.length} → \${valid.length} versions\`);
                fs.writeFileSync(file, JSON.stringify(valid, null, 2));
              }
            "
          done

      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      - name: Add .nojekyll
        run: touch build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          force_orphan: true