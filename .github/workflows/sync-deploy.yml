# .github/workflows/ci.yml
name: Version from branches → Build → Deploy

on:
  push:
    branches: [ test, 'test-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pages
  cancel-in-progress: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTS: "fast2 arender flowerdocs"

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ⬇️ Tirer UNIQUEMENT les objets LFS nécessaires au commit courant
      - name: Resolve LFS pointers in sources (pre)
        shell: bash
        run: |
          set -euo pipefail
          # fetch ciblé (pas de --all pour éviter les refs cassées)
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout
          # garde-fou (info): si des pointeurs restent, on les verra ici
          if grep -RIl "git-lfs.github.com/spec/v1" static docs 2>/dev/null; then
            echo "::warning::Some LFS pointers still present in sources after pre step (will be fixed later if not used in build)"
          fi

      - name: Fetch all branches (explicit)
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Docusaurus versions from test-<product>-v* branches (LFS-safe)
        shell: bash
        run: |
          set -euo pipefail

          # (Re)génération propre
          rm -rf versioned_docs versioned_sidebars

          for product in $PRODUCTS; do
            echo "=== ${product} ==="

            # Sauvegarde du "current"
            rm -rf ".cache_${product}_current" && mkdir -p ".cache_${product}_current"
            rsync -a "docs/${product}/" ".cache_${product}_current/"

            # Branches versionnées
            mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | grep "^origin/test-${product}-v" | sed 's#^origin/##' | sort -V)

            for br in "${branches[@]}"; do
              ver="${br##test-${product}-}"   # v1, v2, ...
              echo "-> snapshot ${product} ${ver} from ${br}"

              # ✅ Worktree détaché au lieu de git archive
              wt=".wt_${product}_${ver}"
              git worktree add --force --detach "$wt" "origin/${br}"

              # ✅ Résoudre LFS pour ce worktree uniquement
              (
                set -euo pipefail
                cd "$wt"
                git lfs pull --include="docs/${product}/**" --exclude=""
                git lfs checkout
              )

              rm -rf .tmp_docs && mkdir -p .tmp_docs
              if [ -d "${wt}/docs/${product}" ]; then
                rsync -a --delete "${wt}/docs/${product}/" .tmp_docs/
              else
                echo "   (skip ${br}: docs/${product} not found)"
                git worktree remove -f "$wt"
                continue
              fi

              rsync -a --delete .tmp_docs/ "docs/${product}/"
              npx docusaurus "docs:version:${product}" "${ver}"

              git worktree remove -f "$wt"
            done

            # Restaure le "current"
            rsync -a --delete ".cache_${product}_current/" "docs/${product}/"
          done

      # Après la versioning, re-matérialiser au cas où
      - name: Resolve LFS pointers in sources (post-versioning)
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout

      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      - name: Add .nojekyll
        run: touch build/.nojekyll

      # 🚨 Le build publié ne doit contenir AUCUN pointeur LFS
      - name: Assert no LFS pointers in build
        shell: bash
        run: |
          if grep -RIl "git-lfs.github.com/spec/v1" build 2>/dev/null; then
            echo "ERROR: LFS pointer found in build output."
            exit 1
          fi
          echo "OK: no LFS pointers"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          force_orphan: true