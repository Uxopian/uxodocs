# .github/workflows/ci.yml
name: Version from branches → Build → Deploy

on:
  push:
    branches: [ test, 'test-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pages
  cancel-in-progress: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTS: "fast2 arender flowerdocs"

    steps:
      # ------------------------------------------------------------
      # Checkout du dépôt avec les objets LFS
      # ------------------------------------------------------------
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ------------------------------------------------------------
      # S'assurer que les fichiers LFS sont bien matérialisés
      # ------------------------------------------------------------
      - name: Resolve LFS pointers in sources (pre)
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout
          if grep -RIl "git-lfs.github.com/spec/v1" static docs 2>/dev/null; then
            echo "::warning::Some LFS pointers still present in sources before versioning"
          fi

      # ------------------------------------------------------------
      # Récupère toutes les branches (pour les worktrees)
      # ------------------------------------------------------------
      - name: Fetch all branches
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      # ------------------------------------------------------------
      # Setup Node + dépendances
      # ------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # ------------------------------------------------------------
      # Supprime les anciennes versions Docusaurus
      # ------------------------------------------------------------
      - name: Clean old versions + manifests
        run: |
          rm -rf versioned_docs versioned_sidebars
          rm -f versions-*.json

      # ------------------------------------------------------------
      # Génération des versions pour chaque produit (LFS-safe)
      # ------------------------------------------------------------
      - name: Generate Docusaurus versions from test-<product>-v* branches
        shell: bash
        run: |
          set -euo pipefail

          for product in $PRODUCTS; do
            echo "=== ${product} ==="

            # Sauvegarde du "current"
            rm -rf ".cache_${product}_current" && mkdir -p ".cache_${product}_current"
            rsync -a "docs/${product}/" ".cache_${product}_current/"

            # Liste des branches versionnées (test-<product>-v*)
            mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | grep "^origin/test-${product}-v" | sed 's#^origin/##' | sort -V)

            for br in "${branches[@]}"; do
              ver="${br##test-${product}-}"
              echo "-> snapshot ${product} ${ver} from ${br}"

              # Crée un worktree temporaire pour cette branche
              wt=".wt_${product}_${ver}"
              git worktree add --force --detach "$wt" "origin/${br}"

              # Résout les objets LFS dans le worktree
              (
                set -euo pipefail
                cd "$wt"
                git lfs pull --include="docs/${product}/**" --exclude=""
                git lfs checkout
              )

              rm -rf .tmp_docs && mkdir -p .tmp_docs
              if [ -d "${wt}/docs/${product}" ]; then
                rsync -a --delete "${wt}/docs/${product}/" .tmp_docs/
              else
                echo "   (skip ${br}: docs/${product} not found)"
                git worktree remove -f "$wt"
                continue
              fi

              # Copie et versionne
              rsync -a --delete .tmp_docs/ "docs/${product}/"
              npx docusaurus "docs:version:${product}" "${ver}"

              # Supprime le worktree
              git worktree remove -f "$wt"
            done

            # Restaure le current
            rsync -a --delete ".cache_${product}_current/" "docs/${product}/"
          done

      # ------------------------------------------------------------
      # Re-matérialiser les LFS (après les snapshots)
      # ------------------------------------------------------------
      - name: Resolve LFS pointers in sources (post-versioning)
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="static/**,docs/**" --exclude=""
          git lfs checkout

      # ------------------------------------------------------------
      # Vérifier la cohérence des versions (aucune version fantôme)
      # ------------------------------------------------------------
      - name: Sanity check versions
        shell: bash
        run: |
          set -euo pipefail
          for product in $PRODUCTS; do
            file="versions-${product}.json"
            if [ -f "$file" ]; then
              node -e "
                const fs=require('fs');
                const arr=JSON.parse(fs.readFileSync('$file','utf8'));
                for (const ver of arr) {
                  const dir=\`versioned_docs/version-${product}-\${ver}\`;
                  if (!fs.existsSync(dir)) {
                    console.error(\`Version \${ver} for ${product} is declared in ${file} but \${dir} is missing.\`);
                    process.exit(1);
                  }
                }
              "
            fi
          done

      # ------------------------------------------------------------
      # Build du site
      # ------------------------------------------------------------
      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      # ------------------------------------------------------------
      # Ajoute .nojekyll pour GitHub Pages
      # ------------------------------------------------------------
      - name: Add .nojekyll
        run: touch build/.nojekyll

      # ------------------------------------------------------------
      # Vérifie qu'aucun pointeur LFS n'a fini dans le build
      # ------------------------------------------------------------
      - name: Assert no LFS pointers in build
        shell: bash
        run: |
          if grep -RIl "git-lfs.github.com/spec/v1" build 2>/dev/null; then
            echo "ERROR: LFS pointer found in build output."
            exit 1
          fi
          echo "✅ OK: no LFS pointers"

      # ------------------------------------------------------------
      # Déploiement vers GitHub Pages
      # ------------------------------------------------------------
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          force_orphan: true
